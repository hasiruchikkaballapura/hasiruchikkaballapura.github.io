<!--
  =====================================================================
   index.html  |  Hasiru Shaale adoption app: the page
  =====================================================================
   What this file does : everything people see. It talks to Code.gs
                         through the web app link in section P2.1.
   Where it lives      : GitHub, hasiruchikkaballapura.github.io,
                         folder hasirushaale-adoption/
                         (with the A4 form file a4-visit-form.pdf next to it).
   Data                : none is stored in this file. All data stays in
                         the Google Sheet. The sign-in key (Client ID) is
                         fetched from the backend, so it is not typed here.
                         A half-filled visit form is kept on the phone
                         (until it is saved or discarded); half-filled
                         short forms (call, update details, A4 note ...)
                         are kept on the phone for 60 minutes.

   HOW TO CHANGE ONE PART
   Every section sits between a START line and an END line, e.g.
      /* ===== START P9.9 Example ===== */  ...  /* ===== END P9.9 ===== */
   To replace a section: Ctrl+F the START line, select from it down to
   its END line (both included), paste the new section, Commit changes.

    P6    Record your visit

<!-- ===== START P10.1 Page body ===== -->
<header class="top" id="top" hidden>
  <div class="top-in">
    <div class="top-row">
      <div><div class="brand">Hasiru Shaale · Phase 2</div><div class="title">School adoption</div></div>
      <div class="who"><div id="who-name"></div><button class="link" id="signout" type="button">Sign out</button></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>
<main class="main" id="main"><div class="signin-box"><div class="card">Loading…</div></div></main>
<!-- ===== END P10.1 ===== -->

<script>
/* ===== START P2.1 Web app link ===== */
// Paste the web app link (it ends in /exec) between the quotes.
var CONFIG = {
  EXEC_URL: 'https://script.google.com/macros/s/AKfycbwiPbvvTZoShDMtUDFjSLNMj7LEsSot4F2M30UUgO7pxoUXj93vypjB04l_991g8oBq/exec',
  A4_FORM_FILE: 'a4-visit-form.pdf'     // the printable A4 form, kept in the same GitHub folder
};
/* ===== END P2.1 ===== */

/* ===== START P3.1 Call Code.gs ===== */
// Every request goes to the /exec link in P2.1, with the sign-in token added.
function apiCall(action, data) {
  var req = Object.assign({ action: action, token: APP.token || '' }, data || {});
  return fetch(CONFIG.EXEC_URL, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // plain text, so the browser sends it straight away
    body: JSON.stringify(req)
  }).then(function (r) { return r.json(); })
    .then(function (res) {
      // signed out: show the sign-in page and stop here (the screen that asked waits for ever)
      if (res && res.needSignIn) { signOut(res.error); return new Promise(function () { }); }
      return res;
    }, function () {
      return { ok: false, error: 'Could not reach the server. Check the internet and try again.' };
    });
}
// After a save, the server's short-term memory is filled again in the background,
// so the next screen opens quickly. Nobody waits for it.
function warmSoon() {
  clearTimeout(APP.warmT);
  APP.warmT = setTimeout(function () { apiCall('warm'); }, 1500);
}
/* ===== END P3.1 ===== */

/* ===== START P3.2 Google sign-in ===== */
// The Client ID comes from the backend (Script Property OAUTH_CLIENT_ID).
// The sign-in lasts about one hour; it is kept only in this browser tab.
function showSignIn(message) {
  document.getElementById('top').hidden = true;
  setMain('<div class="signin-box"><div class="card">' +
    '<div class="brand">Hasiru Shaale · Phase 2</div><h2>School adoption</h2>' +
    '<p class="small">Sign in with the Google account of the email you gave in the volunteer sign-up form.</p>' +
    (message ? '<div class="msg bad" style="margin-top:12px">' + esc(message) + '</div>' : '') +
    '<div id="gbtn"></div>' +
    '<p class="small" style="margin-top:16px">If the button does not appear, open this link in Chrome (not inside WhatsApp).</p>' +
    '</div></div>');
  whenGoogleReady(function () {
    google.accounts.id.initialize({ client_id: APP.clientId, callback: onSignedIn, auto_select: true, cancel_on_tap_outside: true });
    google.accounts.id.renderButton(document.getElementById('gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill' });
  });
}
function whenGoogleReady(fn, tries) {
  tries = tries || 0;
  if (window.google && google.accounts && google.accounts.id) return fn();
  if (tries > 100) { setMain('<div class="signin-box"><div class="msg bad">Google sign-in could not load. Check the internet connection and reload.</div></div>'); return; }
  setTimeout(function () { whenGoogleReady(fn, tries + 1); }, 100);
}
function onSignedIn(resp) {
  APP.token = resp.credential;
  try { sessionStorage.setItem('hs_token', APP.token); } catch (e) { }
  loadMe();
}
function signOut(message) {
  APP.token = ''; APP.me = null; APP.pages = {}; APP.mySchools = null;
  if (!APP.clientId) {
    apiCall('config').then(function (res) { APP.clientId = res.clientId || ''; signOut(message); });
    return;
  }
  try { sessionStorage.removeItem('hs_token'); } catch (e) { }
  if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
  showSignIn(message || '');
}
// The version of this page (P0.0). If the server has a different version, the phone may be showing an old copy.
function pageVersion() { var m = document.querySelector('meta[name=app-version]'); return m ? m.content : ''; }
function versionNotice(server) {
  var d = document.createElement('div');
  d.className = 'msg warn'; d.id = 'vernote'; d.style.cssText = 'max-width:980px;margin:8px auto 0';
  d.innerHTML = 'This page is ' + esc(pageVersion()) + ', the server is ' + esc(server) + '. If something looks old, <button class="link" type="button" id="verreload">tap here to load the newest page</button>.';
  document.getElementById('top').appendChild(d);
  document.getElementById('verreload').addEventListener('click', function () { location.replace(location.pathname + '?v=' + Date.now() + location.hash); });
}
function loadMe() {
  setMain('<div class="signin-box"><div class="card">Signing you in…</div></div>');
  apiCall('me').then(function (res) {
    if (!res.ok) { signOut(res.error); return; }
    APP.me = res.person; APP.settings = res.settings || {};
    APP.mySchools = res.schools || null;             // My schools come with the sign-in, saving one wait
    APP.preSchools = true;
    APP.alertCount = res.alertCount || 0; APP.alertT = Date.now();
    if (res.clientId) APP.clientId = res.clientId;
    document.getElementById('top').hidden = false;
    document.getElementById('who-name').innerHTML = esc(res.person.name + ' · ' + res.person.role) + ' <span class="ver">' + esc(pageVersion()) + '</span>';
    if (res.version && res.version !== pageVersion()) versionNotice(res.version);
    buildTabs();
    route();
  }).catch(function () { });
}
/* ===== END P3.2 ===== */

/* ===== START P4.1 Words used on the screens ===== */
var WORDS = {
  tabVolunteer: 'Volunteer', tabCoordinator: 'Coordinator', tabAdmin: 'Admin', tabMap: 'Map',
  mySchools: 'My schools',
  noSchools: 'No schools are assigned to you yet. Your coordinator will assign them soon.',
  noOwnSchools: 'You have no schools of your own. This tab shows only the schools you adopt yourself. Your volunteers\' schools are in the Coordinator tab.',
  caution: 'Not ready or merged: take care before assigning',
  notWilling: 'School not willing to support',
  readOnly: 'You are only viewing this school. To work on it, give it to one of your volunteers (or to yourself) in Assignments.',
  firstTitle: 'First thing on arrival',
  firstHelp: 'Reminders only. Do them when you are at the school.',
  locTitle: 'School location',
  photoTitle: 'School front photo',
  bookTitle: 'Have you given the Hasiru Shaale book to the school?',
  formTitle: 'Physical form (A4)',
  formHelp: 'Download and print the form, fill it at the school, then take a clear photo of each side and upload it here. The office enters it into the app.',
  formDone: 'Uploaded. Thank you! The office will enter it.',
  callTitle: 'Call the school',
  callHelp: 'If the school does not allow your visit, fill the physical (A4) form during this call, from home.',
  visitTitle: 'Record your visit',
  visitOff: 'Record your visit is switched off for now. Please use the physical (A4) form above.',

// "Last visit", "Visit due" and "Call due" (the numbers of days are in the Settings tab).
function dueChips(s) {

    if (!res.ok) {

function openLocPaste() { var b = document.getElementById('locpastebox'), o = document.getElementById('locpasteopen'); if (b) b.hidden = false; if (o) o.hidden = true; }
function locHelp(code) {
  var steps = code === 1 ?
    '<b>Location is blocked for this page.</b><ol><li>Turn on <b>Location</b> on the phone (pull down from the top of the screen).</li><li>In Chrome, tap the icon left of the web address (🔒 or ⓘ) → <b>Permissions</b> → <b>Location</b> → <b>Allow</b>.</li><li>Reload the page and tap the button again.</li></ol>' :

function wireFirst() {
  var s = APP.school;
  var ch = document.getElementById('locchange');
  if (ch) ch.addEventListener('click', function () { document.getElementById('locreason').hidden = false; ch.hidden = true; });
  var go = document.getElementById('locgo');
  var saveLoc = function (data, btn, label, done) {
    var msg = document.getElementById('locmsg'), why = document.getElementById('locwhy');
    data.schoolId = s.id; data.reason = why ? why.value : '';
    btn.textContent = 'Saving…';
    apiCall('saveLocation', data).then(function (res) {
      if (!res.ok) { btn.disabled = false; btn.textContent = label; msg.innerHTML = '<div class="msg bad" style="margin-top:6px">' + esc(res.error) + '</div>'; return; }
      s.first.location = res.link; s.first.locationDate = res.date || 'today'; s.location = res.link;
      keepClear('loc');

      redraw(['firstbox']);
    });
  };
  var needWhy = function () {
    var why = document.getElementById('locwhy');
    if (s.first.location && why && !why.value.trim()) { document.getElementById('locmsg').innerHTML = '<div class="msg bad" style="margin-top:6px">Write why you are changing it.</div>'; return true; }
    return false;
  };
  if (go) go.addEventListener('click', function () {
    var msg = document.getElementById('locmsg'), label = '📍 Save my current location';
    if (needWhy()) return;
    if (!navigator.geolocation) { msg.innerHTML = locHelp(0); openLocPaste(); return; }
    go.disabled = true; go.textContent = 'Finding your location…'; msg.innerHTML = '';
    var ok = function (pos) { saveLoc({ lat: pos.coords.latitude, lng: pos.coords.longitude }, go, label, 'Location saved (within about ' + Math.round(pos.coords.accuracy) + ' m).'); };
    var fail = function (err) { go.disabled = false; go.textContent = label; msg.innerHTML = locHelp(err.code); openLocPaste(); };
    // first a precise GPS position; if that times out, a rougher one (mobile network or Wi-Fi)
    navigator.geolocation.getCurrentPosition(ok, function (err) {
      if (err.code === 1) return fail(err);
      go.textContent = 'Still trying (rough position)…';
      navigator.geolocation.getCurrentPosition(ok, fail, { enableHighAccuracy: false, timeout: 20000, maximumAge: 300000 });
    }, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
  });
  var lpOpen = document.getElementById('locpasteopen');
  if (lpOpen) lpOpen.addEventListener('click', openLocPaste);
  var lpGo = document.getElementById('locpastego');
  if (lpGo) lpGo.addEventListener('click', function () {
    var v = document.getElementById('locpaste').value.trim();
    if (!v) { document.getElementById('locmsg').innerHTML = '<div class="msg bad" style="margin-top:6px">Paste the Google Maps link first.</div>'; return; }
    if (needWhy()) return;
    lpGo.disabled = true;
    saveLoc({ link: v }, lpGo, 'Save this link', 'Location saved from the map link.');
  });
  var pf = document.getElementById('photofile');
  if (pf) pf.addEventListener('change', function () {
    var file = pf.files && pf.files[0], msg = document.getElementById('photomsg');
    if (!file) return;

      if (!res.ok) { msg.innerHTML = '<div class="msg bad" style="margin-top:6px">' + esc(res.error) + '</div>'; return; }
      s.first.photo = res.link || 'saved'; s.first.photoDate = res.date || 'today'; s.frontPhoto = s.first.photo;
      toast('Front photo saved.'); redraw(['firstbox']);
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-book]'), function (b) {
    b.addEventListener('click', function () {
      b.disabled = true;
      apiCall('saveBook', { schoolId: s.id, value: b.dataset.book }).then(function (res) {
        b.disabled = false;
        if (!res.ok) { document.getElementById('bookmsg').innerHTML = '<div class="msg bad" style="margin-top:6px">' + esc(res.error) + '</div>'; return; }
        s.first.book = b.dataset.book; s.first.bookDate = res.date || 'today'; s.bookGiven = b.dataset.book;
        toast('Saved.'); redraw(['firstbox']);
      });
    });
  });

// Makes a photo at most 1600 pixels on its long side (JPEG, about 300-500 KB), so uploads are quick but still readable.
// Other files (PDF, audio, video) are sent as they are.
function shrinkFile(file) {
  return new Promise(function (ok) {
    var reader = new FileReader();
    reader.onload = function () {
      if (!/^image\//i.test(file.type)) { ok({ type: file.type || 'application/octet-stream', name: file.name, data: reader.result }); return; }
      var img = new Image();
      img.onload = function () {
        var max = 1600, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok({ type: 'image/jpeg', name: file.name, data: c.toDataURL('image/jpeg', 0.8) });
      };
      img.onerror = function () { ok({ type: 'image/jpeg', name: file.name, data: reader.result }); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function todayIST() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}
// "2026-11-04" -> "4 Nov 2026"
function niceDate(d) {
  var m = String(d || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return d || '';
  return Number(m[3]) + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][Number(m[2]) - 1] + ' ' + m[1];
}

// Boxes marked data-keep (call log, Update details, A4 note, location reason, "not willing" reason)
// are kept on this phone while they are typed. If the phone goes to the home screen, the page is
// closed or Back is pressed, they come back when the school is opened again (for 60 minutes).
// They are removed when the form is saved or cancelled.
var KEEP_MINUTES = 60;
var KEEP_OPEN = {
  call: function () { openCallForm(); },
  upd: function () { openUpdate('', true); },
  loc: function () { var r = document.getElementById('locreason'), c = document.getElementById('locchange'); if (r) r.hidden = false; if (c) c.hidden = true; },
  nw: function () { var f = document.getElementById('nwform'), o = document.getElementById('nwopen'); if (f) f.hidden = false; if (o) o.hidden = true; }
};
function keepKey(k) { return 'hs_keep_' + (APP.me && APP.me.email || '') + '_' + (APP.school && APP.school.id) + '_' + k; }
function keepStore(ev) {
  var el = ev.target;
  if (!el || !el.dataset || !el.dataset.keep || !APP.school) return;
  try { localStorage.setItem(keepKey(el.dataset.keep), JSON.stringify({ v: el.type === 'checkbox' ? el.checked : el.value, t: Date.now() })); } catch (e) { }
}
function keepRestore() {
  if (!APP.school || APP.school.readOnly) return;
  var opened = {}, any = false;
  Array.prototype.forEach.call(document.querySelectorAll('[data-keep]'), function (el) {
    var k = keepKey(el.dataset.keep), o = null;
    try { o = JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { o = null; }
    if (!o) return;
    if (Date.now() - o.t > KEEP_MINUTES * 60000) { try { localStorage.removeItem(k); } catch (e) { } return; }
    if (el.type === 'checkbox') el.checked = !!o.v; else el.value = o.v;
    if (el.tagName === 'SELECT') el.dispatchEvent(new Event('change'));
    var real = el.type === 'checkbox' ? !!o.v : (o.v !== '' && o.v !== el.defaultValue);
    if (real) { opened[el.dataset.keep.split('.')[0]] = true; any = true; }
  });
  Object.keys(opened).forEach(function (g) { if (KEEP_OPEN[g]) KEEP_OPEN[g](); });
  if (any) toast(WORDS.kept);
}
function keepClear(group) {
  try {
    var pre = keepKey(group + '.');
    Object.keys(localStorage).forEach(function (k) { if (k.indexOf(pre) === 0) localStorage.removeItem(k); });
  } catch (e) { }
}
document.addEventListener('input', keepStore, true);
document.addEventListener('change', keepStore, true);

function isoFromNice(t) { var d = new Date(t); return isNaN(d) ? todayIST() : d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function readVisitForm() {
  var v = {}, f = document.getElementById('vform');
  Array.prototype.forEach.call(f.querySelectorAll('[data-k]'), function (el) { v[el.dataset.k] = el.value; });
  Array.prototype.forEach.call(f.querySelectorAll('[data-bool]'), function (el) { v[el.dataset.bool] = el.checked; });
  Array.prototype.forEach.call(f.querySelectorAll('[data-multi]'), function (el) {

    if (el.checked) v[el.dataset.multi].push(el.value);
  });
  v.acts = Array.prototype.map.call(f.querySelectorAll('#vf-acts .act-row'), function (r) {
    var a = {}; Array.prototype.forEach.call(r.querySelectorAll('[data-a]'), function (el) { a[el.dataset.a] = el.value; }); return a;
  }).filter(function (a) { return a.what || a.minutes || a.boys || a.girls || a.teachers || a.grades; });

function fillVisitForm(v) {

  Array.prototype.forEach.call(f.querySelectorAll('[data-multi]'), function (el) { el.checked = (v[el.dataset.multi] || []).indexOf(el.value) >= 0; });

        var v = APP.vols.filter(function (x) { return x.email === b.dataset.for; })[0];

    APP.corr = res;
    drawCorrections();
  });
}
function drawCorrections() {
  var res = APP.corr;
  var h = subTabs() + '<h2>Corrections</h2><p class="small">Proposed with "Update details". Approving shows the new value in the app at once (it is recorded in the Corrections tab). School Data keeps the original value; nothing needs to be copied by hand.</p>';
  if (!res.pending.length) h += '<div class="card">Nothing is waiting.</div>';
  res.pending.forEach(function (c) {
    h += '<div class="card" style="margin-bottom:10px"><b>' + esc(c.field) + '</b> · <button class="link" type="button" data-open="' + c.schoolId + '">' + esc(c.school) + '</button>' +
      '<div style="margin-top:6px">New: <b>' + esc(c.value) + '</b></div>' + (c.species ? '<div class="small">Species: ' + esc(c.species) + '</div>' : '') +
      '<div class="old">' + (c.field.indexOf('Other') === 0 ? 'About: ' : 'Now: ') + esc(c.old || '-') + '</div>' +
      '<div class="small">Proposed by ' + esc(c.by) + ', ' + esc(c.on) + '</div>' +
      '<div style="margin-top:8px;display:flex;gap:8px"><button class="btn sm primary" type="button" data-dec="Approve" data-id="' + esc(c.id) + '">Approve</button>' +
      '<button class="btn sm danger" type="button" data-dec="Reject" data-id="' + esc(c.id) + '">Reject</button></div></div>';
  });
  if (res.done.length) {
    h += '<h3 style="margin-top:18px">Recently decided</h3><div class="tbl-wrap"><table><thead><tr><th>School</th><th>What</th><th>New value</th><th>Decision</th></tr></thead><tbody>' +
      res.done.map(function (c) { return '<tr><td>' + esc(c.school) + '</td><td>' + esc(c.field) + '</td><td>' + esc(c.value) + '</td><td>' + chip(c.status, /approved/i.test(c.status) ? 'good' : 'bad') + '<div class="small">' + esc(c.decidedBy) + ', ' + esc(c.decidedOn) + '</div></td></tr>'; }).join('') +
      '</tbody></table></div>';
  }
  setMain(h); wireSubTabs();
  Array.prototype.forEach.call(document.querySelectorAll('[data-open]'), function (b) { b.addEventListener('click', function () { openSchoolFrom(b.dataset.open); }); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-dec]'), function (b) {
    b.addEventListener('click', function () {
      Array.prototype.forEach.call(document.querySelectorAll('[data-id="' + b.dataset.id + '"]'), function (x) { x.disabled = true; });
      apiCall('decide', { id: b.dataset.id, decision: b.dataset.dec }).then(function (r) {
        if (!r.ok) { toast(r.error); drawCorrections(); return; }
        var c = res.pending.filter(function (x) { return x.id === b.dataset.id; })[0];
        res.pending = res.pending.filter(function (x) { return x !== c; });
        if (c) { c.status = b.dataset.dec === 'Approve' ? 'Approved' : 'Rejected'; c.decidedBy = APP.me.email; c.decidedOn = r.decidedOn || ''; res.done.unshift(c); APP.pages = {}; }
        toast(b.dataset.dec === 'Approve' ? 'Approved.' : 'Rejected.'); warmSoon(); drawCorrections();
      });
    });
  });
}
/* ===== END P7.7 ===== */

/* ===== START P7.8 Person picker (search inside the list) ===== */
// One box: type a name or email and the list below it narrows as you type; tap a person to choose.
// people: [{email, name, schools, wants, area}]; onPick(email) is called with the chosen email.
function personCombo(boxId, people, current, onPick, label) {
  var box = document.getElementById(boxId);
  if (!box) return;
  var cur = people.filter(function (p) { return p.email === current; })[0] || null;
  box.innerHTML = '<label class="f combo-wrap">' + esc(label || 'Person') + '<div class="combo"><input type="search" class="combo-in" autocomplete="off" placeholder="Tap to choose a person (type to search)" value="' + esc(cur ? cur.name : '') + '"><button type="button" class="combo-arrow" tabindex="-1" aria-label="Show the list">▾</button>' +
    '<div class="combo-list" role="listbox" hidden></div></div></label>';
  var input = box.querySelector('.combo-in'), list = box.querySelector('.combo-list');
  box.querySelector('.combo-arrow').addEventListener('mousedown', function (e) { e.preventDefault(); if (document.activeElement === input && !list.hidden) { list.hidden = true; } else { input.focus(); draw(); } });
  input.addEventListener('click', function () { if (list.hidden) draw(); });
  var draw = function () {
    var q = input.value.trim().toLowerCase();
    if (cur && input.value === cur.name) q = '';
    var hits = people.filter(function (p) { return !q || (p.name + ' ' + p.email + ' ' + (p.area || '') + ' ' + (p.centre || '')).toLowerCase().indexOf(q) >= 0; });
    list.innerHTML = (hits.length ? hits.slice(0, 80).map(function (p) {
      return '<button type="button" class="combo-item" data-email="' + esc(p.email) + '"><b>' + esc(p.name) + '</b> <span class="small">' + esc(p.email) +
        (p.schools !== undefined ? ' · has ' + p.schools + (p.wants ? ', wants ' + esc(p.wants) : '') : '') + (p.area ? ' · ' + esc(p.area) : '') + '</span></button>';
    }).join('') + (hits.length > 80 ? '<div class="small" style="padding:8px 10px">' + (hits.length - 80) + ' more: type more letters to narrow.</div>' : '')
      : '<div class="small" style="padding:8px 10px">Nobody matches.</div>');
    list.hidden = false;
  };
  var pick = function (email) {
    cur = people.filter(function (p) { return p.email === email; })[0] || null;
    input.value = cur ? cur.name : '';
    list.hidden = true;
    onPick(email);
  };
  input.addEventListener('focus', draw);
  input.addEventListener('input', draw);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { var f = list.querySelector('.combo-item'); if (f) { e.preventDefault(); pick(f.dataset.email); input.blur(); } }
    if (e.key === 'Escape') list.hidden = true;
  });
  list.addEventListener('mousedown', function (e) { e.preventDefault(); });   // keeps the box open while tapping
  list.addEventListener('click', function (e) { var b = e.target.closest('.combo-item'); if (b) { pick(b.dataset.email); input.blur(); } });
  input.addEventListener('blur', function () { setTimeout(function () { list.hidden = true; if (cur && !input.value.trim()) input.value = cur.name; }, 150); });
}
/* ===== END P7.8 ===== */

/* ===== START P8.1 Map ===== */
// Solid dot = real position saved at the school. Hollow dot = approximate (village, or near the taluk centre).
// Admin: all schools. Coordinator: their volunteers' schools (and own). Volunteer: ONLY their own schools.
// The search box searches as you type (school name, village, GP or UDISE); one match opens its popup.
var MAPF = { taluk: '', show: '', q: '' };
function screenMap() {
  setMain('<h2>Map</h2><div class="filters" id="mf"></div><div class="legend" id="mlegend"></div><div id="map"><p class="small" style="padding:12px">Loading the map…</p></div><p class="small" id="mcount"></p>');
  loadLeaflet(function () {
    apiCall('map').then(function (res) {
      if (!document.getElementById('map')) return;
      if (!res.ok) { document.getElementById('map').innerHTML = '<div class="msg bad">' + esc(res.error) + '</div>'; return; }
      APP.points = res.points;
      var taluks = res.points.map(function (p) { return p.t; }).filter(function (v, i, a) { return v && a.indexOf(v) === i; }).sort();
      document.getElementById('mf').innerHTML = '<select data-m="taluk"><option value="">All taluks</option>' + taluks.map(function (t) { return '<option' + (MAPF.taluk === t ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select>' +
        '<select data-m="show">' + [['', 'All schools'], ['given', 'Given to a volunteer'], ['free', 'Not given'], ['visited', 'Visited'], ['notwilling', 'Not willing'], ['caution', 'Not ready or merged'], ['gps', 'Real position saved']]
          .map(function (x) { return '<option value="' + x[0] + '"' + (MAPF.show === x[0] ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('') + '</select>' +
        '<input type="search" data-m="q" id="mq" placeholder="Search school, village or UDISE" value="' + esc(MAPF.q) + '" style="min-width:220px">';
      document.getElementById('mlegend').innerHTML = [['--map-visited', 'Visited'], ['--map-given', 'Given, not visited yet'], ['--map-free', 'Not given'], ['--map-bad', 'Not willing'], ['--map-caution', 'Not ready or merged']]
        .map(function (x) { return '<span><span class="dot" style="background:var(' + x[0] + ')"></span>' + x[1] + '</span>'; }).join('') +
        '<span><span class="dot"  style="background:var(--muted)"></span>real position</span><span style="color:var(--muted)"><span class="dot hollow"></span>approximate</span>';
      Array.prototype.forEach.call(document.querySelectorAll('select[data-m]'), function (el) {
        el.addEventListener('change', function () { MAPF[el.dataset.m] = el.value; drawMap(true); });
      });
      var qi = document.getElementById('mq');
      qi.addEventListener('input', function () { clearTimeout(APP.mapT); APP.mapT = setTimeout(function () { MAPF.q = qi.value.trim(); drawMap(true); }, 300); });
      qi.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); clearTimeout(APP.mapT); MAPF.q = qi.value.trim(); drawMap(true); } });
      document.getElementById('map').innerHTML = '';
      APP.map = L.map('map', { preferCanvas: true }).setView([13.55, 77.75], 9);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(APP.map);
      APP.mapLayer = L.layerGroup().addTo(APP.map);
      drawMap(true);
    });
  });
}
function loadLeaflet(done) {
  if (window.L) return done();
  var css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(css);
  var js = document.createElement('script'); js.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
  js.onload = done;
  js.onerror = function () { var m = document.getElementById('map'); if (m) m.innerHTML = '<div class="msg bad">The map could not load. Check the internet and try again.</div>'; };
  document.head.appendChild(js);
}
function drawMap(fit) {
  if (!APP.map) return;
  var cs = getComputedStyle(document.documentElement), col = function (v) { return cs.getPropertyValue(v).trim(); };
  var q = MAPF.q.toLowerCase();
  var pts = APP.points.filter(function (p) {
    if (MAPF.taluk && p.t !== MAPF.taluk) return false;
    if (MAPF.show === 'given' && !p.a) return false;
    if (MAPF.show === 'free' && p.a) return false;
    if (MAPF.show === 'visited' && !p.lv) return false;
    if (MAPF.show === 'notwilling' && !p.w) return false;
    if (MAPF.show === 'caution' && !p.c) return false;
    if (MAPF.show === 'gps' && p.k !== 'gps') return false;
    return !q || (p.n + ' ' + p.v + ' ' + p.g + ' ' + (p.u || '')).toLowerCase().indexOf(q) >= 0;
  });
  APP.mapLayer.clearLayers();
  var rank = function (p) { return p.w ? 4 : p.lv ? 3 : p.a ? 2 : p.c ? 1 : 0; };
  pts.sort(function (a, b) { return rank(a) - rank(b); });      // free schools below, given and visited on top
  var bounds = [], only = null;
  pts.forEach(function (p) {
    var c = p.w ? col('--map-bad') : p.c ? col('--map-caution') : p.lv ? col('--map-visited') : p.a ? col('--map-given') : col('--map-free');
    var real = p.k === 'gps';
    var m = L.circleMarker([p.la, p.lo], { radius: real ? 7 : 6, color: c, weight: real ? 1 : 2, fillColor: c, fillOpacity: real ? 0.9 : 0.05 });
    m.bindPopup('<b>' + esc(p.n) + '</b><br>' + esc([p.v, p.g, p.h, p.t].filter(String).join(' · ')) + (p.u ? '<br>UDISE ' + esc(p.u) : '') + '<br>' +
      (p.a ? 'With ' + esc(p.a) : 'Not given') + (p.lv ? '<br>Last visit ' + esc(niceDate(p.lv)) : '') + (p.w ? '<br><b>' + WORDS.notWilling + '</b>' : '') +
      (p.al ? '<br><b style="color:#b06d00">⚠ Needs attention</b>' : '') + (p.gr ? '<br>Vol ' + p.gr : '') + '<br><span style="color:#888">' + (real ? 'Real position' : p.k === 'village' ? 'Approximate (village)' : 'Approximate (taluk)') + '</span><br>' +
      '<a href="https://www.google.com/maps?q=' + p.la + ',' + p.lo + '" target="_blank" rel="noopener">Open in Google Maps</a> · <a href="#" data-mapopen="' + p.id + '">Open school</a>');
    m.addTo(APP.mapLayer);
    bounds.push([p.la, p.lo]);
    only = m;
  });
  document.getElementById('mcount').textContent = pts.length ? pts.length + ' school' + (pts.length === 1 ? '' : 's') + ' on the map.' : (q ? 'No school matches "' + MAPF.q + '".' : 'No school to show.');
  if (bounds.length && fit) APP.map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
  if (pts.length === 1 && q && only) only.openPopup();
}
document.addEventListener('click', function (ev) {
  var a = ev.target.closest && ev.target.closest('[data-mapopen]');
  if (!a) return;
  ev.preventDefault();
  openSchoolFrom(a.dataset.mapopen);
});
/* ===== END P8.1 ===== */

/* ===== START P10.2 Tabs, screens and the phone Back button ===== */
// Top tabs: Volunteer · Coordinator · Admin · Map (each person sees only their own).
// Every screen has its own address (#vol, #admin/dashboard, #vol/school/12 ...), so the
// phone's Back button moves back inside the app instead of closing it.
var TOP = {
  vol: { label: 'tabVolunteer', roles: ['Volunteer', 'Coordinator', 'Admin'] },
  coord: { label: 'tabCoordinator', roles: ['Coordinator'], subs: [['volunteers', 'Volunteers'], ['alerts', 'Alerts'], ['assign', 'Assignments'], ['corrections', 'Corrections']] },
  admin: { label: 'tabAdmin', roles: ['Admin'], subs: [['dashboard', 'Dashboard'], ['alerts', 'Alerts'], ['assign', 'Assignments'], ['volunteers', 'Volunteers'], ['coordinators', 'Coordinators'], ['a4', 'A4 forms'], ['corrections', 'Corrections']] },
  map: { label: 'tabMap', roles: ['Volunteer', 'Coordinator', 'Admin'] }
};
function myTops() {
  return Object.keys(TOP).filter(function (k) {
    if (TOP[k].roles.indexOf(APP.me.role) < 0) return false;
    if (k === 'map' && APP.me.role === 'Volunteer') return /^on$/i.test(APP.settings.mapVolunteers);
    if (k === 'map' && APP.me.role === 'Coordinator') return /^on$/i.test(APP.settings.mapCoordinators);
    return true;
  });
}
function buildTabs() {
  document.getElementById('tabs').innerHTML = myTops().map(function (k) {
    return '<button role="tab" type="button" data-tab="' + k + '">' + WORDS[TOP[k].label] + ((k === 'admin' || k === 'coord') && APP.alertCount ? '<span class="badge">' + APP.alertCount + '</span>' : '') + '</button>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) {
    b.addEventListener('click', function () { location.hash = b.dataset.tab; });
  });
}
function subTabs() {
  var top = APP.where.top, t = TOP[top];
  if (!t || !t.subs) return '';
  return '<div class="subtabs">' + t.subs.map(function (s) {
    return '<button type="button" data-sub="' + top + '/' + s[0] + '" aria-selected="' + (APP.where.sub === s[0]) + '">' + s[1] + (s[0] === 'alerts' && APP.alertCount ? '<span class="badge">' + APP.alertCount + '</span>' : '') + '</button>';
  }).join('') + '</div>';
}
function wireSubTabs() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-sub]'), function (b) {
    b.addEventListener('click', function () { location.hash = b.dataset.sub; });
  });
}
function route() {
  if (!APP.me) return;
  if (APP.map) { try { APP.map.remove(); } catch (e) { } APP.map = null; }
  var tops = myTops();
  var parts = (location.hash || '').replace('#', '').split('/');
  var top = tops.indexOf(parts[0]) >= 0 ? parts[0] : (APP.me.role === 'Admin' ? 'admin' : APP.me.role === 'Coordinator' ? 'coord' : 'vol');
  var sub = parts[1] || '';
  if (TOP[top].subs && sub !== 'school' && !TOP[top].subs.some(function (s) { return s[0] === sub; })) sub = TOP[top].subs[0][0];
  if (!TOP[top].subs && sub !== 'school') sub = '';
  APP.where = { top: top, sub: sub };
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === top)); });
  window.scrollTo(0, 0);
  refreshAlertCount();
  if (sub === 'school' && parts[2]) return screenSchool(parts[2], APP.backHash || (top === 'vol' || top === 'map' ? top : top + '/' + TOP[top].subs[0][0]));
  if (top === 'vol') return screenMySchools();
  if (top === 'map') return screenMap();
  if (sub === 'volunteers') return screenVolunteers();
  if (sub === 'dashboard') return screenDashboard();
  if (sub === 'a4') return screenA4List();
  if (sub === 'assign') return screenAssign();
  if (sub === 'coordinators') return screenCoordinators();
  if (sub === 'corrections') return screenCorrections();
  if (sub === 'alerts') return screenAlerts();
}
// Opens a school and remembers this screen, so "Back" returns here.
function openSchoolFrom(id) {
  APP.backHash = (location.hash || '#vol').replace('#', '');
  location.hash = APP.where.top + '/school/' + id;
}
window.addEventListener('hashchange', route);
/* ===== END P10.2 ===== */

/* ===== START P10.3 Small helpers ===== */
var APP = { token: '', clientId: '', me: null, settings: {}, vols: [], volsT: 0, school: null, a4files: [], preSchools: null, mySchools: null, pages: {}, openVol: '', backHash: '',
            where: { top: '', sub: '' }, picked: {}, office: null, editVisit: null, visitPhotos: [], giveTo: '', usePref: false, people: [], points: [], map: null,
            grpRes: null, findRes: null, corr: null };
function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fmtN(n) { return (n === null || n === undefined || n === '') ? '-' : Number(n).toLocaleString('en-IN'); }
// Orange chips for open alerts on a school (Pit digging / tree guard, Concern)
function alertChips(list) { return (list || []).map(function (k) { return chip('⚠ ' + k, 'warn'); }).join(''); }
function addAlerts(s, ticks) {
  s.alerts = s.alerts || [];
  (ticks || []).forEach(function (t) {
    var k = /pit|tree guard/i.test(t) ? 'Pit digging / tree guard' : /concern/i.test(t) ? 'Concern' : '';
    if (k && s.alerts.indexOf(k) < 0) s.alerts.push(k);
  });
  var c = document.getElementById('schoolchips'); if (c && APP.school === s) c.innerHTML = schoolChips(s);
}
function chip(t, kind) { return '<span class="chip' + (kind ? ' ' + kind : '') + '">' + esc(t) + '</span>'; }
function kv(label, value) { return '<div><dt>' + esc(label) + '</dt><dd>' + esc(value === '' || value === null || value === undefined ? '-' : value) + '</dd></div>'; }
function opts(list, cur) { return '<option value="">Choose…</option>' + (list || []).map(function (x) { return '<option' + (x === cur ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join(''); }
function setMain(html) { document.getElementById('main').innerHTML = html; }
function toast(text) {
  Array.prototype.forEach.call(document.querySelectorAll('.toast'), function (x) { x.remove(); });
  var t = document.createElement('div');
  t.className = 'msg good toast'; t.textContent = text;
  t.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:2000;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:90vw';
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 4000);
}
/* ===== END P10.3 ===== */

(function start() {

      return;
    }
    APP.clientId = res.clientId;
    showSignIn('');
