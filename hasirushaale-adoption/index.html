<!--
  =====================================================================
   index.html  |  Hasiru Shaale adoption app: the page
  =====================================================================
   What this file does : everything people see. It talks to Code.gs.
   Where it lives      : GitHub, hasiruchikkaballapura.github.io,
                         folder hasirushaale-adoption/  (sign-in works here).
                         The same file also opens from the Apps Script
                         /exec link (only the connection check works there).
   Data                : none is stored in this file. All data stays in
                         the Google Sheet. The sign-in key (Client ID) is
                         fetched from the backend, so it is not typed here.

   HOW TO CHANGE ONE PART
   Every section sits between a START line and an END line, e.g.
      /* ===== START P5.1 My schools ===== */  ...  /* ===== END P5.1 ===== */
   To replace a section: Ctrl+F the START line, select from it down to
   its END line (both included), paste the new section, Commit changes.

    P5    Volunteer

-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hasiru Shaale · School adoption</title>

<!-- ===== START P0.0 Version ===== -->
<meta name="app-version" content="2026-11-03 v3">

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
/* ===== START P1.1 Colours (light and dark) ===== */
:root {
  --bg: #f6f8f6; --surface: #ffffff; --surface-2: #f0f4f1; --ink: #17231c; --muted: #5c6b62; --line: #d5ddd7;
  --accent: #2f6b45; --accent-ink: #ffffff; --accent-soft: #eaf3ec;
  --warn: #8a5a00; --warn-soft: #fff4dc; --bad: #b3261e; --bad-soft: #fbeaea; --link: #1a5fb4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111713; --surface: #1a221d; --surface-2: #212b25; --ink: #e6efe8; --muted: #9fb0a5; --line: #2c3a31;
    --accent: #7cc796; --accent-ink: #10261a; --accent-soft: #1f3327;
    --warn: #f3c56b; --warn-soft: #3a2f16; --bad: #f2b8b5; --bad-soft: #3a1f1e; --link: #8ab4f8;
  }
}
/* ===== END P1.1 ===== */

/* ===== START P1.2 Page layout ===== */
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.top { background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
.top-in, .main { max-width: 980px; margin: 0 auto; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.title { font-size: 20px; font-weight: 700; line-height: 1.2; }
.who { font-size: 14px; color: var(--muted); text-align: right; }
.main { padding: 18px max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); }
h2 { font-size: 22px; line-height: 1.2; margin: 4px 0 12px; }
h3 { font-size: 17px; margin: 0 0 6px; }
.small { font-size: 14px; color: var(--muted); }
.stack > * + * { margin-top: 12px; }
.grid-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
/* ===== END P1.2 ===== */

/* ===== START P1.3 Cards, chips, buttons, tabs, tables ===== */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.card.caution { border-color: var(--warn); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.tile .n { font-size: 26px; font-weight: 700; line-height: 1.1; }
.tile .l { font-size: 13px; color: var(--muted); }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); margin: 2px 4px 2px 0; }
.chip.good { background: var(--accent-soft); color: var(--accent); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.btn { font: inherit; font-size: 15px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sm { font-size: 14px; padding: 5px 10px; }
.link { color: var(--link); text-decoration: underline; cursor: pointer; background: none; border: 0; font: inherit; padding: 0; }
.tabs { display: flex; gap: 4px; overflow-x: auto; margin-top: 10px; }
.tabs button { font: inherit; font-size: 15px; padding: 8px 12px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px 16px; margin: 10px 0 0; }
.kv dt { font-size: 12px; color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.phone { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
select, input[type=search], input[type=text] { font: inherit; font-size: 15px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); max-width: 100%; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--surface-2); }
td.n, th.n { text-align: right; }
.msg { padding: 12px 14px; border-radius: 10px; background: var(--surface-2); }
.msg.bad { background: var(--bad-soft); color: var(--bad); }
.msg.warn { background: var(--warn-soft); color: var(--warn); }
.signin-box { max-width: 460px; margin: 40px auto; text-align: center; }
.signin-box .card { padding: 28px 22px; }
#gbtn { display: flex; justify-content: center; margin-top: 18px; min-height: 44px; }
.sl { color: var(--muted); font-weight: 600; margin-right: 6px; }
/* ===== END P1.3 ===== */
</style>

<body>

<!-- ===== START P10.1 Page body ===== -->
<header class="top" id="top" hidden>
  <div class="top-in">
    <div class="top-row">
      <div><div class="brand">Hasiru Shaale · Phase 2</div><div class="title">School adoption</div></div>
      <div class="who"><div id="who-name"></div><button class="link" id="signout" type="button">Sign out</button></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>
<main class="main" id="main"><div class="signin-box"><div class="card">Loading…</div></div></main>
<!-- ===== END P10.1 ===== -->

<script>
/* ===== START P2.1 Web app link ===== */
// Paste the web app link (it ends in /exec) between the quotes.
var CONFIG = {
  EXEC_URL: 'https://script.google.com/macros/s/AKfycbwiPbvvTZoShDMtUDFjSLNMj7LEsSot4F2M30UUgO7pxoUXj93vypjB04l_991g8oBq/exec'
};
/* ===== END P2.1 ===== */

/* ===== START P3.1 Call Code.gs ===== */
// Works in two places:
//  - opened from the Apps Script /exec link: uses google.script.run;
//  - opened from GitHub: uses the /exec link in P2.1.
// The sign-in token is added to every request automatically.
var INSIDE_APPS_SCRIPT = (typeof google !== 'undefined' && google.script && google.script.run);
function apiCall(action, data) {
  var req = Object.assign({ action: action, token: APP.token || '' }, data || {});
  var p;
  if (INSIDE_APPS_SCRIPT) {
    p = new Promise(function (ok, fail) {
      google.script.run.withSuccessHandler(function (txt) { ok(JSON.parse(txt)); }).withFailureHandler(fail).apiRun(req);
    });
  } else {
    p = fetch(CONFIG.EXEC_URL, {
      method: 'POST', redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // plain text, so the browser sends it straight away
      body: JSON.stringify(req)
    }).then(function (r) { return r.json(); });
  }
  return p.then(function (res) {
    if (res && res.needSignIn) { signOut(res.error); throw new Error(res.error); }
    return res;
  });
}
/* ===== END P3.1 ===== */

/* ===== START P3.2 Google sign-in ===== */
// The Client ID comes from the backend (Script Property OAUTH_CLIENT_ID).
// The sign-in lasts about one hour; it is kept only in this browser tab.
function showSignIn(message) {
  document.getElementById('top').hidden = true;
  setMain('<div class="signin-box"><div class="card">' +
    '<div class="brand">Hasiru Shaale · Phase 2</div><h2>School adoption</h2>' +
    '<p class="small">Sign in with the Google account of the email you gave in the volunteer sign-up form.</p>' +
    (message ? '<div class="msg bad" style="margin-top:12px">' + esc(message) + '</div>' : '') +
    '<div id="gbtn"></div>' +
    '<p class="small" style="margin-top:16px">If the button does not appear, open this link in Chrome (not inside WhatsApp).</p>' +
    '</div></div>');
  whenGoogleReady(function () {
    google.accounts.id.initialize({ client_id: APP.clientId, callback: onSignedIn, auto_select: true, cancel_on_tap_outside: true });
    google.accounts.id.renderButton(document.getElementById('gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill' });
  });
}
function whenGoogleReady(fn, tries) {
  tries = tries || 0;
  if (window.google && google.accounts && google.accounts.id) return fn();
  if (tries > 100) { setMain('<div class="signin-box"><div class="msg bad">Google sign-in could not load. Check the internet connection and reload.</div></div>'); return; }
  setTimeout(function () { whenGoogleReady(fn, tries + 1); }, 100);
}
function onSignedIn(resp) {
  APP.token = resp.credential;
  try { sessionStorage.setItem('hs_token', APP.token); } catch (e) { }
  loadMe();
}
function signOut(message) {
  APP.token = ''; APP.me = null;
  try { sessionStorage.removeItem('hs_token'); } catch (e) { }
  if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
  showSignIn(message || '');
}
function loadMe() {
  setMain('<div class="signin-box"><div class="card">Signing you in…</div></div>');
  apiCall('me').then(function (res) {
    if (!res.ok) { signOut(res.error); return; }
    APP.me = res.person; APP.settings = res.settings;
    document.getElementById('top').hidden = false;
    document.getElementById('who-name').textContent = res.person.name + ' · ' + res.person.role;
    buildTabs();
    route();
  }).catch(function () { });
}
/* ===== END P3.2 ===== */

/* ===== START P4.1 Words used on the screens ===== */
var WORDS = {
  tabSchools: 'My schools',
  tabVolunteers: 'Volunteers',
  tabOverview: 'Overview',
  tabFind: 'Schools',
  noSchools: 'No schools are assigned to you yet. Your coordinator will assign them soon.',
  caution: 'Not ready or merged: take care before assigning',
  notWilling: 'School not willing to support'
};
/* ===== END P4.1 ===== */

/* ===== START P5.1 My schools ===== */
function screenMySchools() {
  setMain('<h2>' + WORDS.tabSchools + '</h2><p class="small">Loading your schools…</p>');
  apiCall('mySchools').then(function (res) {
    if (!res.ok) { setMain('<div class="msg bad">' + esc(res.error) + '</div>'); return; }
    var list = res.schools || [];
    var h = '<h2>' + WORDS.tabSchools + '</h2>';
    if (!list.length) { setMain(h + '<div class="card">' + WORDS.noSchools + '</div>'); return; }
    h += '<p class="small">' + list.length + ' school' + (list.length === 1 ? '' : 's') + ' adopted</p><div class="stack">';
    list.forEach(function (s, i) { h += schoolCard(s, i + 1); });
    setMain(h + '</div>');
  });
}
/* ===== END P5.1 ===== */

/* ===== START P5.2 School card ===== */
// Place from Taluk down to Village, then students; both phone numbers with Call buttons.
function schoolCard(s, sl) {
  var given = [];
  if (s.saplings) given.push(fmtN(s.saplings) + ' saplings');
  if (s.seeds) given.push(fmtN(s.seeds) + ' seeds');
  var h = '<div class="card' + (s.caution ? ' caution' : '') + '">';
  h += '<h3><span class="sl">' + sl + '.</span>' + esc(s.name) + '</h3>';
  h += '<div>' + (s.caution ? chip(WORDS.caution, 'warn') : '') + (s.notWilling ? chip(WORDS.notWilling, 'bad') : '') +
       (s.group ? chip('Vol ' + s.groupNo) : '') + chip(s.activity || '-') + '</div>';
  h += '<dl class="kv">' +
    kv('Taluk', s.taluk) + kv('Hobli', s.hobli) + kv('Gram panchayat (GP)', s.gp) + kv('Village', s.village) +
    kv('Students', s.students === null ? '-' : fmtN(s.students)) + kv('UDISE code', s.udise) +
    kv('Given in Phase 1', given.join(' + ') || '-') + kv('Date of first visit', s.firstVisit) +
    '<div><dt>Head master or principal</dt><dd>' + esc(s.hmName || '-') + phoneLine(s.hmPhone) + '</dd></div>' +
    (s.altName || s.altPhone ? '<div><dt>Alternative contact</dt><dd>' + esc(s.altName || '-') + phoneLine(s.altPhone) + '</dd></div>' : '') +
    '</dl></div>';
  return h;
}
function phoneLine(num) {
  var d = String(num || '').replace(/\D/g, '');
  if (!d) return '';
  return '<div class="phone"><span>' + esc(num) + '</span><a class="btn sm" href="tel:' + (d.length === 10 ? '+91' + d : d) + '">Call</a></div>';
}
/* ===== END P5.2 ===== */

/* ===== START P7.1 Volunteers list ===== */
// Admin sees everybody; a coordinator sees only their own volunteers.
function screenVolunteers() {
  setMain('<h2>Volunteers</h2><p class="small">Loading…</p>');
  apiCall('volunteers').then(function (res) {
    if (!res.ok) { setMain('<div class="msg bad">' + esc(res.error) + '</div>'); return; }
    APP.vols = res.volunteers || [];
    var isAdmin = APP.me.role === 'Admin';
    var h = '<h2>' + (isAdmin ? 'All people in the Vol tab' : 'Your volunteers') + '</h2>';
    h += '<div class="filters"><input type="search" id="vq" placeholder="Search name, email, centre or area" style="min-width:260px">' +
         '<select id="vshow"><option value="">Everyone</option><option value="none">No schools yet</option><option value="with">With schools</option>' +
         (isAdmin ? '<option value="check">Email to check</option><option value="inactive">Inactive</option>' : '') + '</select>' +
         (isAdmin ? '<button class="btn sm" id="vrefresh" type="button">Refresh volunteers from the sign-up form</button>' : '') + '</div>';
    h += '<div id="vlist"></div>';
    setMain(h);
    document.getElementById('vq').addEventListener('input', drawVolunteers);
    document.getElementById('vshow').addEventListener('change', drawVolunteers);
    if (isAdmin) document.getElementById('vrefresh').addEventListener('click', function (ev) {
      ev.target.disabled = true; ev.target.textContent = 'Refreshing…';
      apiCall('refreshVolunteers').then(function (r) { toast(r.ok ? r.added + ' new volunteer(s) added.' : r.error); screenVolunteers(); });
    });
    drawVolunteers();
  });
}
function drawVolunteers() {
  var q = (document.getElementById('vq').value || '').toLowerCase(), show = document.getElementById('vshow').value;
  var list = APP.vols.filter(function (v) {
    if (show === 'none' && v.schools) return false;
    if (show === 'with' && !v.schools) return false;
    if (show === 'check' && !/check/i.test(v.note)) return false;
    if (show === 'inactive' && /^active$/i.test(v.status)) return false;
    return !q || (v.name + ' ' + v.email + ' ' + v.centre + ' ' + v.area).toLowerCase().indexOf(q) >= 0;
  });
  var h = '<p class="small">' + list.length + ' shown</p><div class="tbl-wrap"><table><thead><tr><th>#</th><th>Name</th><th>Role · Status</th><th>Phone</th><th>Centre</th><th class="n">Wants</th><th class="n">Schools allotted</th><th>Preferred area</th></tr></thead><tbody>';
  list.forEach(function (v, i) {
    h += '<tr><td>' + (i + 1) + '</td><td><b>' + esc(v.name) + '</b><div class="small">' + esc(v.email) + '</div>' + (v.note ? chip(v.note, /check/i.test(v.note) ? 'warn' : '') : '') + '</td>' +
      '<td>' + esc(v.role) + '<br>' + chip(v.status, /^active$/i.test(v.status) ? 'good' : 'bad') + '</td>' +
      '<td>' + esc(v.phone || '-') + '</td><td>' + esc(v.centre || '-') + '</td><td class="n">' + esc(v.wants || '-') + '</td>' +
      '<td class="n"><b>' + v.schools + '</b></td><td>' + esc(v.area || '-') + '</td></tr>';
  });
  document.getElementById('vlist').innerHTML = h + '</tbody></table></div>';
}
/* ===== END P7.1 ===== */

/* ===== START P7.2 Admin overview ===== */
function screenOverview() {
  setMain('<h2>Overview</h2><p class="small">Loading…</p>');
  apiCall('overview').then(function (res) {
    if (!res.ok) { setMain('<div class="msg bad">' + esc(res.error) + '</div>'); return; }
    var o = res.overview;
    var t = function (n, l) { return '<div class="tile"><div class="n">' + fmtN(n) + '</div><div class="l">' + l + '</div></div>'; };
    setMain('<h2>Overview</h2><div class="grid-tiles">' +
      t(o.schools, 'schools in all') + t(o.grouped, 'in ' + fmtN(o.groups) + ' groups') + t(o.caution, 'not ready or merged') +
      t(o.assigned, 'schools assigned') + t(o.groupsFree, 'groups with no volunteer yet') +
      t(o.volunteersActive, 'active volunteers') + t(o.coordinatorsActive, 'active coordinators') + t(o.adminsActive, 'active admins') +
      t(o.inactive, 'inactive in the Vol tab') + t(o.emailChecks, 'emails to check') +
      '</div><p class="small" style="margin-top:14px">Giving schools to volunteers comes in the next step.</p>');
  });
}
/* ===== END P7.2 ===== */

/* ===== START P7.3 Find schools (admin) ===== */
var FIND = { taluk: '', hobli: '', gp: '', q: '', show: '' };
function screenFind() {
  setMain('<h2>Schools</h2><div class="filters" id="ff"></div><div id="flist"><p class="small">Loading…</p></div>');
  runFind();
}
function runFind() {
  apiCall('findSchools', { filters: FIND }).then(function (res) {
    if (!res.ok) { document.getElementById('flist').innerHTML = '<div class="msg bad">' + esc(res.error) + '</div>'; return; }
    var opt = function (list, cur, all) { return '<option value="">' + all + '</option>' + list.map(function (x) { return '<option' + (x === cur ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join(''); };
    document.getElementById('ff').innerHTML =
      '<select data-f="taluk">' + opt(res.taluks, FIND.taluk, 'All taluks') + '</select>' +
      '<select data-f="hobli">' + opt(res.hoblis, FIND.hobli, 'All hoblis') + '</select>' +
      '<select data-f="gp">' + opt(res.gps, FIND.gp, 'All GPs') + '</select>' +
      '<select data-f="show"><option value="">All schools</option><option value="free"' + (FIND.show === 'free' ? ' selected' : '') + '>Not assigned</option><option value="assigned"' + (FIND.show === 'assigned' ? ' selected' : '') + '>Assigned</option><option value="caution"' + (FIND.show === 'caution' ? ' selected' : '') + '>Not ready or merged</option></select>' +
      '<input type="search" data-f="q" placeholder="School, village, UDISE or Vol number" value="' + esc(FIND.q) + '" style="min-width:240px">';
    Array.prototype.forEach.call(document.querySelectorAll('#ff [data-f]'), function (el) {
      el.addEventListener(el.tagName === 'INPUT' ? 'change' : 'change', function () {
        FIND[el.dataset.f] = el.value;
        if (el.dataset.f === 'taluk') { FIND.hobli = ''; FIND.gp = ''; }
        if (el.dataset.f === 'hobli') FIND.gp = '';
        document.getElementById('flist').innerHTML = '<p class="small">Loading…</p>';
        runFind();
      });
    });
    var h = '<p class="small">' + fmtN(res.total) + ' school' + (res.total === 1 ? '' : 's') + (res.total > res.schools.length ? ', first ' + res.schools.length + ' shown' : '') + '. Press Enter after typing in the search box.</p>';
    h += '<div class="tbl-wrap"><table><thead><tr><th class="n">Sl. No.</th><th>School</th><th>Place</th><th>Group</th><th>Given</th><th>Assigned to</th></tr></thead><tbody>';
    res.schools.forEach(function (s) {
      var given = [s.saplings ? fmtN(s.saplings) + ' saplings' : '', s.seeds ? fmtN(s.seeds) + ' seeds' : ''].filter(String).join(' + ');
      h += '<tr><td class="n">' + s.id + '</td><td><b>' + esc(s.name) + '</b><div class="small">' + esc(s.udise) + '</div>' + (s.caution ? chip(s.activity === 'Not Ready' ? 'Not ready' : 'Merged', 'warn') : '') + (s.notWilling ? chip(WORDS.notWilling, 'bad') : '') + '</td>' +
        '<td>' + esc(s.taluk) + '<div class="small">' + esc([s.hobli, s.gp, s.village].join(' · ')) + '</div></td>' +
        '<td>' + (s.group ? 'Vol ' + s.groupNo : '-') + '</td><td>' + esc(given || '-') + '</td><td>' + esc(s.assignedTo || '-') + '</td></tr>';
    });
    document.getElementById('flist').innerHTML = h + '</tbody></table></div>';
  });
}
/* ===== END P7.3 ===== */

/* ===== START P10.2 Screens, tabs and the phone Back button ===== */
// Each tab has its own address (#schools, #volunteers ...), so the phone's Back button
// moves between tabs instead of closing the page.
var SCREENS = {
  schools: { label: function () { return WORDS.tabSchools; }, show: screenMySchools, roles: ['Volunteer', 'Coordinator', 'Admin'] },
  volunteers: { label: function () { return WORDS.tabVolunteers; }, show: screenVolunteers, roles: ['Coordinator', 'Admin'] },
  overview: { label: function () { return WORDS.tabOverview; }, show: screenOverview, roles: ['Admin'] },
  find: { label: function () { return WORDS.tabFind; }, show: screenFind, roles: ['Admin'] }
};
function myScreens() {
  return Object.keys(SCREENS).filter(function (k) { return SCREENS[k].roles.indexOf(APP.me.role) >= 0; });
}
function buildTabs() {
  var keys = myScreens();
  document.getElementById('tabs').innerHTML = keys.map(function (k) {
    return '<button role="tab" type="button" data-tab="' + k + '">' + SCREENS[k].label() + '</button>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) {
    b.addEventListener('click', function () { location.hash = b.dataset.tab; });
  });
}
function route() {
  if (!APP.me) return;
  var keys = myScreens();
  var want = (location.hash || '').replace('#', '');
  if (keys.indexOf(want) < 0) want = APP.me.role === 'Admin' ? 'overview' : APP.me.role === 'Coordinator' ? 'volunteers' : 'schools';
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === want)); });
  SCREENS[want].show();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
/* ===== END P10.2 ===== */

/* ===== START P10.3 Small helpers ===== */
var APP = { token: '', clientId: '', me: null, settings: {}, vols: [] };
function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fmtN(n) { return (n === null || n === undefined || n === '') ? '-' : Number(n).toLocaleString('en-IN'); }
function chip(t, kind) { return '<span class="chip' + (kind ? ' ' + kind : '') + '">' + esc(t) + '</span>'; }
function kv(label, value) { return '<div><dt>' + esc(label) + '</dt><dd>' + esc(value === '' || value === null || value === undefined ? '-' : value) + '</dd></div>'; }
function setMain(html) { document.getElementById('main').innerHTML = html; }
function toast(text) {
  var t = document.createElement('div');
  t.className = 'msg'; t.textContent = text;
  t.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:9;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:90vw';
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 3500);
}
/* ===== END P10.3 ===== */

/* ===== START P10.4 Start ===== */
document.getElementById('signout').addEventListener('click', function () { signOut(''); });
(function start() {
  if (!INSIDE_APPS_SCRIPT && !/\/exec$/.test(CONFIG.EXEC_URL)) {
    setMain('<div class="signin-box"><div class="msg bad">The web app link is not filled in yet. Put it in section P2.1 of this file.</div></div>');
    return;
  }
  apiCall('config').then(function (res) {
    if (!res.ok || !res.clientId) {
      setMain('<div class="signin-box"><div class="msg bad">The backend is reachable, but the sign-in key (OAUTH_CLIENT_ID) is missing in Script Properties.</div></div>');
      return;
    }
    APP.clientId = res.clientId;
    try { APP.token = sessionStorage.getItem('hs_token') || ''; } catch (e) { APP.token = ''; }
    if (APP.token) loadMe(); else showSignIn('');
  }).catch(function () {
    setMain('<div class="signin-box"><div class="msg bad">Could not reach the backend. Check the link in P2.1, and that the web app is deployed with access "Anyone".</div></div>');
  });
})();
/* ===== END P10.4 ===== */
</script>
