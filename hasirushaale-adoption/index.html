<!doctype html>
<!--
  =====================================================================
   index.html  |  Hasiru Shaale adoption app: the page
  =====================================================================
   What this file does : everything people see. It talks to Code.gs
                         through the web app link in section P2.1.
   Where it lives      : GitHub, hasiruchikkaballapura.github.io,
                         folder hasirushaale-adoption/
                         (with the A4 form file a4-visit-form.pdf next to it).
   Data                : none is stored in this file. All data stays in
                         the Google Sheet. The sign-in key (Client ID) is
                         fetched from the backend, so it is not typed here.

   HOW TO CHANGE ONE PART
   Every section sits between a START line and an END line, e.g.
      /* ===== START P9.9 Example ===== */  ...  /* ===== END P9.9 ===== */
   To replace a section: Ctrl+F the START line, select from it down to
   its END line (both included), paste the new section, Commit changes.

   CONTENTS
    P0.0  Version
    P1    Style
      P1.1  Colours (light and dark)
      P1.2  Page layout
      P1.3  Cards, chips, buttons, tabs, tables, forms
    P2    Config
      P2.1  Web app link
    P3    Backend calls and sign-in
      P3.1  Call Code.gs
      P3.2  Google sign-in
    P4    Words
      P4.1  Words used on the screens
    P5    Volunteer tab
      P5.1  My schools (list)
      P5.2  School page
      P5.3  First thing on arrival: location, front photo, book
      P5.4  Physical (A4) form: download and upload
      P5.5  Call log
      P5.6  Photo and date helpers
    P7    Coordinator and Admin tabs
      P7.1  Volunteers list
      P7.2  Admin dashboard
      P7.3  Admin: schools (assignments come in D2)
      P7.4  Admin: uploaded A4 forms
      P7.5  Screens coming later
    P8    Map tab
      P8.1  Map (comes in D5)
    P10   Start-up
      P10.1 Page body
      P10.2 Tabs, screens and the phone Back button
      P10.3 Small helpers
      P10.4 Start
  =====================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hasiru Shaale · School adoption</title>

<!-- ===== START P0.0 Version ===== -->
<meta name="app-version" content="2026-11-03 v6">
<!-- ===== END P0.0 ===== -->

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
/* ===== START P1.1 Colours (light and dark) ===== */
:root {
  --bg: #f6f8f6; --surface: #ffffff; --surface-2: #f0f4f1; --ink: #17231c; --muted: #5c6b62; --line: #d5ddd7;
  --accent: #2f6b45; --accent-ink: #ffffff; --accent-soft: #eaf3ec;
  --warn: #8a5a00; --warn-soft: #fff4dc; --bad: #b3261e; --bad-soft: #fbeaea; --link: #1a5fb4;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111713; --surface: #1a221d; --surface-2: #212b25; --ink: #e6efe8; --muted: #9fb0a5; --line: #2c3a31;
    --accent: #7cc796; --accent-ink: #10261a; --accent-soft: #1f3327;
    --warn: #f3c56b; --warn-soft: #3a2f16; --bad: #f2b8b5; --bad-soft: #3a1f1e; --link: #8ab4f8;
  }
}
/* ===== END P1.1 ===== */

/* ===== START P1.2 Page layout ===== */
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.top { background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); position: sticky; top: 0; z-index: 5; }
.top-in, .main { max-width: 980px; margin: 0 auto; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.title { font-size: 20px; font-weight: 700; line-height: 1.2; }
.who { font-size: 14px; color: var(--muted); text-align: right; }
.main { padding: 16px max(16px, env(safe-area-inset-right)) 56px max(16px, env(safe-area-inset-left)); }
h2 { font-size: 22px; line-height: 1.2; margin: 4px 0 12px; overflow-wrap: anywhere; }
h3 { font-size: 17px; margin: 0 0 6px; }
.small { font-size: 14px; color: var(--muted); }
.stack > * + * { margin-top: 12px; }
.grid-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
/* ===== END P1.2 ===== */

/* ===== START P1.3 Cards, chips, buttons, tabs, tables, forms ===== */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.card.caution { border-color: var(--warn); }
.card.first { border: 2px solid var(--accent); background: var(--accent-soft); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.tile .n { font-size: 26px; font-weight: 700; line-height: 1.1; }
.tile .l { font-size: 13px; color: var(--muted); }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); margin: 2px 4px 2px 0; }
.chip.good { background: var(--accent-soft); color: var(--accent); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.btn { font: inherit; font-size: 15px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sm { font-size: 14px; padding: 5px 10px; }
.btn[disabled] { opacity: .6; cursor: default; }
.link { color: var(--link); text-decoration: underline; cursor: pointer; background: none; border: 0; font: inherit; padding: 0; }
.tabs { display: flex; gap: 4px; overflow-x: auto; margin-top: 10px; }
.tabs button { font: inherit; font-size: 15px; padding: 8px 12px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.subtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.subtabs button { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.subtabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px 16px; margin: 10px 0 0; }
.kv dt { font-size: 12px; color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.kv .wide { grid-column: 1 / -1; }
.phone { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
select, input[type=search], input[type=text], input[type=date], textarea { font: inherit; font-size: 15px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); max-width: 100%; }
textarea { width: 100%; min-height: 70px; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 10px 0; }
.form label, label.f { font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.form .wide { grid-column: 1 / -1; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 15px; color: var(--ink); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--surface-2); }
td.n, th.n { text-align: right; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
.msg { padding: 12px 14px; border-radius: 10px; background: var(--surface-2); }
.msg.bad { background: var(--bad-soft); color: var(--bad); }
.msg.warn { background: var(--warn-soft); color: var(--warn); }
.msg.good { background: var(--accent-soft); color: var(--accent); }
.signin-box { max-width: 460px; margin: 40px auto; text-align: center; }
.signin-box .card { padding: 28px 22px; }
#gbtn { display: flex; justify-content: center; margin-top: 18px; min-height: 44px; }
.sl { color: var(--muted); font-weight: 600; margin-right: 6px; }
.school-btn { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
.school-btn:hover { border-color: var(--accent); }
.first-items { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 10px; }
.first-items .item { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.first-items .item b { display: block; margin-bottom: 6px; }
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.thumbs img { width: 72px; height: 96px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); }
.back { margin-bottom: 10px; }
.line { border-top: 1px solid var(--line); margin: 12px 0; }
.list-row { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.list-row:last-child { border-bottom: 0; }
/* ===== END P1.3 ===== */
</style>
</head>
<body>

<!-- ===== START P10.1 Page body ===== -->
<header class="top" id="top" hidden>
  <div class="top-in">
    <div class="top-row">
      <div><div class="brand">Hasiru Shaale · Phase 2</div><div class="title">School adoption</div></div>
      <div class="who"><div id="who-name"></div><button class="link" id="signout" type="button">Sign out</button></div>
    </div>
    <nav class="tabs" id="tabs" role="tablist"></nav>
  </div>
</header>
<main class="main" id="main"><div class="signin-box"><div class="card">Loading…</div></div></main>
<!-- ===== END P10.1 ===== -->

<script>
/* ===== START P2.1 Web app link ===== */
// Paste the web app link (it ends in /exec) between the quotes.
var CONFIG = {
  EXEC_URL: 'https://hasiruchikkaballapura.github.io/hasirushaale-adoption/',
  A4_FORM_FILE: 'a4-visit-form.pdf'     // the printable A4 form, kept in the same GitHub folder
};
/* ===== END P2.1 ===== */

/* ===== START P3.1 Call Code.gs ===== */
// Every request goes to the /exec link in P2.1, with the sign-in token added.
function apiCall(action, data) {
  var req = Object.assign({ action: action, token: APP.token || '' }, data || {});
  return fetch(CONFIG.EXEC_URL, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // plain text, so the browser sends it straight away
    body: JSON.stringify(req)
  }).then(function (r) { return r.json(); })
    .then(function (res) {
      if (res && res.needSignIn) { signOut(res.error); throw new Error(res.error); }
      return res;
    });
}
/* ===== END P3.1 ===== */

/* ===== START P3.2 Google sign-in ===== */
// The Client ID comes from the backend (Script Property OAUTH_CLIENT_ID).
// The sign-in lasts about one hour; it is kept only in this browser tab.
function showSignIn(message) {
  document.getElementById('top').hidden = true;
  setMain('<div class="signin-box"><div class="card">' +
    '<div class="brand">Hasiru Shaale · Phase 2</div><h2>School adoption</h2>' +
    '<p class="small">Sign in with the Google account of the email you gave in the volunteer sign-up form.</p>' +
    (message ? '<div class="msg bad" style="margin-top:12px">' + esc(message) + '</div>' : '') +
    '<div id="gbtn"></div>' +
    '<p class="small" style="margin-top:16px">If the button does not appear, open this link in Chrome (not inside WhatsApp).</p>' +
    '</div></div>');
  whenGoogleReady(function () {
    google.accounts.id.initialize({ client_id: APP.clientId, callback: onSignedIn, auto_select: true, cancel_on_tap_outside: true });
    google.accounts.id.renderButton(document.getElementById('gbtn'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill' });
  });
}
function whenGoogleReady(fn, tries) {
  tries = tries || 0;
  if (window.google && google.accounts && google.accounts.id) return fn();
  if (tries > 100) { setMain('<div class="signin-box"><div class="msg bad">Google sign-in could not load. Check the internet connection and reload.</div></div>'); return; }
  setTimeout(function () { whenGoogleReady(fn, tries + 1); }, 100);
}
function onSignedIn(resp) {
  APP.token = resp.credential;
  try { sessionStorage.setItem('hs_token', APP.token); } catch (e) { }
  loadMe();
}
function signOut(message) {
  APP.token = ''; APP.me = null;
  if (!APP.clientId) {
    apiCall('config').then(function (res) { APP.clientId = res.clientId || ''; signOut(message); });
    return;
  }
  try { sessionStorage.removeItem('hs_token'); } catch (e) { }
  if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
  showSignIn(message || '');
}
function loadMe() {
  setMain('<div class="signin-box"><div class="card">Signing you in…</div></div>');
  apiCall('me').then(function (res) {
    if (!res.ok) { signOut(res.error); return; }
    APP.me = res.person; APP.settings = res.settings || {};
    APP.preSchools = res.schools || null;            // My schools come with the sign-in, saving one wait
    if (res.clientId) APP.clientId = res.clientId;
    document.getElementById('top').hidden = false;
    document.getElementById('who-name').textContent = res.person.name + ' · ' + res.person.role;
    buildTabs();
    route();
  }).catch(function () { });
}
/* ===== END P3.2 ===== */

/* ===== START P4.1 Words used on the screens ===== */
var WORDS = {
  tabVolunteer: 'Volunteer', tabCoordinator: 'Coordinator', tabAdmin: 'Admin', tabMap: 'Map',
  mySchools: 'My schools',
  noSchools: 'No schools are assigned to you yet. Your coordinator will assign them soon.',
  caution: 'Not ready or merged: take care before assigning',
  notWilling: 'School not willing to support',
  firstTitle: 'First thing on arrival',
  firstHelp: 'Reminders only. Do them when you are at the school.',
  locTitle: 'School location',
  photoTitle: 'School front photo',
  bookTitle: 'Have you given the Hasiru Shaale book to the school?',
  formTitle: 'Physical form (A4)',
  formHelp: 'Download and print the form, fill it at the school, then take a clear photo of each side and upload it here. The office enters it into the app.',
  formDone: 'Uploaded. Thank you! The office will enter it.',
  callTitle: 'Call the school',
  callHelp: 'If the school does not allow your visit, fill the physical (A4) form during this call, from home.',
  visitOff: 'Record your visit is switched off for now. Please use the physical (A4) form above.'
};
/* ===== END P4.1 ===== */

/* ===== START P5.1 My schools (list) ===== */
function screenMySchools() {
  setMain('<h2>' + WORDS.mySchools + '</h2><p class="small">Loading your schools…</p>');
  var ready = APP.preSchools ? Promise.resolve({ ok: true, schools: APP.preSchools }) : apiCall('mySchools');
  APP.preSchools = null;
  ready.then(function (res) {
    if (!res.ok) { setMain('<div class="msg bad">' + esc(res.error) + '</div>'); return; }
    var list = res.schools || [];
    var h = '<h2>' + WORDS.mySchools + '</h2>';
    if (!list.length) { setMain(h + '<div class="card">' + WORDS.noSchools + '</div>'); return; }
    h += '<p class="small">' + list.length + ' school' + (list.length === 1 ? '' : 's') + ' adopted. Tap a school to open it.</p><div class="stack">';
    list.forEach(function (s, i) {
      h += '<button type="button" class="card school-btn' + (s.caution ? ' caution' : '') + '" data-open="' + s.id + '">' +
        '<h3><span class="sl">' + (i + 1) + '.</span>' + esc(s.name) + '</h3>' +
        '<div class="small">' + esc([s.village, s.gp, s.hobli, s.taluk].filter(String).join(' · ')) + '</div>' +
        '<div style="margin-top:6px">' + (s.caution ? chip(WORDS.caution, 'warn') : '') + (s.notWilling ? chip(WORDS.notWilling, 'bad') : '') +
        chip(s.location ? 'Location saved' : 'Location not saved yet', s.location ? 'good' : 'warn') +
        chip(s.frontPhoto ? 'Front photo saved' : 'Front photo not taken yet', s.frontPhoto ? 'good' : 'warn') + '</div></button>';
    });
    setMain(h + '</div>');
    Array.prototype.forEach.call(document.querySelectorAll('[data-open]'), function (b) {
      b.addEventListener('click', function () { location.hash = 'vol/school/' + b.dataset.open; });
    });
  });
}
/* ===== END P5.1 ===== */

/* ===== START P5.2 School page ===== */
// One school, opened from My schools (#vol/school/12) or by the admin (#admin/school/12).
function screenSchool(id, backHash) {
  setMain('<button class="btn sm back" type="button" id="back">← Back</button><p class="small">Loading the school…</p>');
  document.getElementById('back').addEventListener('click', function () { location.hash = backHash; });
  apiCall('school', { schoolId: id }).then(function (res) {
    if (!res.ok) { setMain('<button class="btn sm back" type="button" id="back">← Back</button><div class="msg bad">' + esc(res.error) + '</div>'); document.getElementById('back').addEventListener('click', function () { location.hash = backHash; }); return; }
    var s = res.school; APP.school = s;
    var given = [];
    if (s.saplings) given.push(fmtN(s.saplings) + ' saplings');
    if (s.seeds) given.push(fmtN(s.seeds) + ' seeds');
    var visitOn = APP.me.role === 'Coordinator' ? /^on$/i.test(APP.settings.visitFormCoordinators) : /^on$/i.test(APP.settings.visitFormVolunteers);
    var h = '<button class="btn sm back" type="button" id="back">← Back</button>';
    h += '<h2>' + esc(s.name) + '</h2>';
    h += '<div>' + (s.caution ? chip(WORDS.caution, 'warn') : '') + (s.notWilling ? chip(WORDS.notWilling + (s.first.notWillingReason ? ': ' + s.first.notWillingReason : ''), 'bad') : '') +
         (s.group ? chip('Vol ' + s.groupNo) : '') + chip(s.activity || '-') + '</div>';
    h += '<div class="stack" style="margin-top:12px">';
    h += '<div class="card first" id="firstbox">' + firstBox(s) + '</div>';
    h += '<div class="card" id="formbox">' + formBox(s) + '</div>';
    h += '<div class="card" id="callbox">' + callBox(s) + '</div>';
    h += '<div class="card"><h3>Record your visit</h3><p class="small">' + (visitOn ? 'Comes in D3.' : WORDS.visitOff) + '</p></div>';
    h += '<div class="card"><h3>School details</h3><dl class="kv">' +
      kv('Taluk', s.taluk) + kv('Hobli', s.hobli) + kv('Gram panchayat (GP)', s.gp) + kv('Village', s.village) +
      kv('Students', s.students === null ? '-' : fmtN(s.students)) + kv('UDISE code', s.udise) +
      kv('Given in Phase 1', given.join(' + ') || '-') + kv('Date of first visit', s.firstVisit) + kv('1st visit volunteer', s.firstVol) +
      (s.species ? '<div class="wide"><dt>Species and remarks</dt><dd class="small">' + esc(s.species) + '</dd></div>' : '') +
      '</dl><p class="small" style="margin-top:12px">Something wrong in these details? "Update details" comes in D4.</p></div>';
    h += '</div>';
    setMain(h);
    document.getElementById('back').addEventListener('click', function () { location.hash = backHash; });
    wireFirst(); wireForm(); wireCall();
  });
}
/* ===== END P5.2 ===== */

/* ===== START P5.3 First thing on arrival: location, front photo, book ===== */
// All three are reminders only: nothing else waits for them.
function firstBox(s) {
  var f = s.first, isAdmin = APP.me.role === 'Admin';
  var h = '<h3>' + WORDS.firstTitle + '</h3><p class="small">' + WORDS.firstHelp + '</p><div class="first-items">';
  // location
  h += '<div class="item"><b>📍 ' + WORDS.locTitle + '</b>';
  if (f.location) {
    h += chip('Saved ' + f.locationDate, 'good') + '<div style="margin-top:6px"><a class="btn sm" href="' + esc(f.location) + '" target="_blank" rel="noopener">Open in Google Maps</a></div>' +
         '<div style="text-align:right;margin-top:6px"><button class="link small" type="button" id="locchange">Change location</button></div>' +
         '<div id="locreason" hidden><label class="f" style="margin-top:6px">Why are you changing it?<input type="text" id="locwhy" placeholder="For example: the first pin was on the road"></label>' +
         '<button class="btn sm primary" type="button" id="locgo" style="margin-top:6px">📍 Save my current location</button></div>';
  } else {
    h += '<p class="small">Stand at the school gate and tap the button.</p><button class="btn primary" type="button" id="locgo">📍 Save my current location</button>';
  }
  h += '<div id="locmsg"></div></div>';
  // front photo
  h += '<div class="item"><b>📷 ' + WORDS.photoTitle + '</b>';
  if (f.photo) {
    h += chip('Saved ' + f.photoDate, 'good') + (isAdmin ? '<div style="margin-top:6px"><a class="link small" href="' + esc(f.photo) + '" target="_blank" rel="noopener">Open the photo</a></div>' : '');
  } else {
    h += '<p class="small">One photo of the school front, taken once.</p><label class="btn primary">📷 Take or choose photo<input type="file" id="photofile" accept="image/*" hidden></label>';
  }
  h += '<div id="photomsg"></div></div>';
  // book
  h += '<div class="item"><b>📗 ' + WORDS.bookTitle + '</b>' +
       '<div style="display:flex;gap:8px;margin-top:4px"><button class="btn' + (f.book === 'Yes' ? ' primary' : '') + '" type="button" data-book="Yes">Yes</button>' +
       '<button class="btn' + (f.book === 'No' ? ' primary' : '') + '" type="button" data-book="No">No</button></div>' +
       (f.book ? '<div class="small" style="margin-top:6px">Saved: ' + esc(f.book) + ', ' + esc(f.bookDate) + '</div>' : '') + '<div id="bookmsg"></div></div>';
  return h + '</div>';
}
function wireFirst() {
  var s = APP.school;
  var ch = document.getElementById('locchange');
  if (ch) ch.addEventListener('click', function () { document.getElementById('locreason').hidden = false; ch.hidden = true; });
  var go = document.getElementById('locgo');
  if (go) go.addEventListener('click', function () {
    var msg = document.getElementById('locmsg'), why = document.getElementById('locwhy');
    if (s.first.location && why && !why.value.trim()) { msg.innerHTML = '<div class="msg bad" style="margin-top:6px">Write why you are changing it.</div>'; return; }
    if (!navigator.geolocation) { msg.innerHTML = '<div class="msg bad" style="margin-top:6px">This phone cannot share its location.</div>'; return; }

// Makes a photo at most 2000 pixels on its long side (JPEG), so uploads are quick but still readable.
function shrinkFile(file) {
  return new Promise(function (ok) {
    var reader = new FileReader();
    reader.onload = function () {
      if (/pdf/i.test(file.type)) { ok({ type: 'application/pdf', data: reader.result }); return; }
      var img = new Image();
      img.onload = function () {
        var max = 2000, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok({ type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85) });
      };
      img.onerror = function () { ok({ type: 'image/jpeg', data: reader.result }); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function todayIST() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}

}
function buildTabs() {
  document.getElementById('tabs').innerHTML = myTops().map(function (k) {
    return '<button role="tab" type="button" data-tab="' + k + '">' + WORDS[TOP[k].label] + '</button>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) {
    b.addEventListener('click', function () { location.hash = b.dataset.tab; });
  });
}
function subTabs() {
  var top = APP.where.top, t = TOP[top];
  if (!t || !t.subs) return '';
  return '<div class="subtabs">' + t.subs.map(function (s) {
    return '<button type="button" data-sub="' + top + '/' + s[0] + '" aria-selected="' + (APP.where.sub === s[0]) + '">' + s[1] + '</button>';
  }).join('') + '</div>';
}
function wireSubTabs() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-sub]'), function (b) {
    b.addEventListener('click', function () { location.hash = b.dataset.sub; });
  });
}
function route() {
  if (!APP.me) return;
  var tops = myTops();
  var parts = (location.hash || '').replace('#', '').split('/');
  var top = tops.indexOf(parts[0]) >= 0 ? parts[0] : (APP.me.role === 'Admin' ? 'admin' : APP.me.role === 'Coordinator' ? 'coord' : 'vol');
  var sub = parts[1] || '';
  if (TOP[top].subs && sub !== 'school' && !TOP[top].subs.some(function (s) { return s[0] === sub; })) sub = TOP[top].subs[0][0];
  APP.where = { top: top, sub: sub };
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) { b.setAttribute('aria-selected', String(b.dataset.tab === top)); });
  window.scrollTo(0, 0);
  if (sub === 'school' && parts[2]) return screenSchool(parts[2], top === 'vol' ? 'vol' : top + '/assign');
  if (top === 'vol') return screenMySchools();
  if (top === 'map') return screenMap();
  if (sub === 'volunteers') return screenVolunteers();
  if (sub === 'dashboard') return screenDashboard();
  if (sub === 'a4') return screenA4List();
  if (sub === 'assign' && top === 'admin') return screenAssign();
  if (sub === 'assign') return screenComing('Assignments', 'D2', 'Here you will give free schools to your own volunteers.');
  if (sub === 'coordinators') return screenComing('Coordinators', 'D2', 'Here you will make volunteers coordinators and give volunteers to coordinators in bulk.');
  if (sub === 'corrections') return screenComing('Corrections', 'D4', 'Here you will approve the changes volunteers propose with "Update details".');
}
window.addEventListener('hashchange', route);
/* ===== END P10.2 ===== */

/* ===== START P10.3 Small helpers ===== */
var APP = { token: '', clientId: '', me: null, settings: {}, vols: [], school: null, a4files: [], preSchools: null, where: { top: '', sub: '' } };
function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fmtN(n) { return (n === null || n === undefined || n === '') ? '-' : Number(n).toLocaleString('en-IN'); }
function chip(t, kind) { return '<span class="chip' + (kind ? ' ' + kind : '') + '">' + esc(t) + '</span>'; }
function kv(label, value) { return '<div><dt>' + esc(label) + '</dt><dd>' + esc(value === '' || value === null || value === undefined ? '-' : value) + '</dd></div>'; }
function setMain(html) { document.getElementById('main').innerHTML = html; }
function toast(text) {
  Array.prototype.forEach.call(document.querySelectorAll('.toast'), function (x) { x.remove(); });
  var t = document.createElement('div');
  t.className = 'msg good toast'; t.textContent = text;
  t.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:9;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:90vw';
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 3500);
}
/* ===== END P10.3 ===== */

/* ===== START P10.4 Start ===== */
// If this tab already signed in, go straight in (one wait instead of two).
document.getElementById('signout').addEventListener('click', function () { signOut(''); });
(function start() {
  if (!/\/exec$/.test(CONFIG.EXEC_URL)) {
    setMain('<div class="signin-box"><div class="msg bad">The web app link is not filled in yet. Put it in section P2.1 of this file.</div></div>');
    return;
  }
  try { APP.token = sessionStorage.getItem('hs_token') || ''; } catch (e) { APP.token = ''; }
  if (APP.token) { loadMe(); return; }
  apiCall('config').then(function (res) {
    if (!res.ok || !res.clientId) {
      setMain('<div class="signin-box"><div class="msg bad">The backend is reachable, but the sign-in key (OAUTH_CLIENT_ID) is missing in Script Properties.</div></div>');
      return;
    }
    APP.clientId = res.clientId;
    showSignIn('');
  }).catch(function () {
    setMain('<div class="signin-box"><div class="msg bad">Could not reach the backend. Check the link in P2.1, and that the web app is deployed with access "Anyone".</div></div>');
  });
})();
/* ===== END P10.4 ===== */
</script>
